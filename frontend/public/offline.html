<!doctype html>
<html lang="id">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#1a3a2e" />
    <title>Offline | Cimitage Tourism</title>
    <style>
      * { box-sizing: border-box; }
      body { margin: 0; min-height: 100vh; display: grid; place-items: center; padding: 24px; background: #f5f7f4; color: #0f172a; font-family: Arial, Helvetica, sans-serif; }
      main { width: 100%; max-width: 560px; padding: 40px 28px; text-align: center; border: 1px solid #f1f5f9; border-radius: 24px; background: #fff; box-shadow: 0 20px 50px rgba(15, 23, 42, .12); }
      .icon { display: grid; place-items: center; width: 64px; height: 64px; margin: 0 auto; border-radius: 16px; background: #1a3a2e; color: #fff; font-size: 30px; }
      .eyebrow { margin: 24px 0 0; color: #047857; font-size: 12px; font-weight: 700; letter-spacing: .18em; text-transform: uppercase; }
      h1 { margin: 10px 0 0; font-size: 26px; line-height: 1.25; }
      p { margin: 16px 0 0; color: #475569; font-size: 15px; line-height: 1.7; }
      button { margin-top: 28px; border: 0; border-radius: 12px; padding: 13px 24px; background: #0ea5e9; color: #fff; font: inherit; font-weight: 700; cursor: pointer; }
      button:hover { background: #0284c7; }
    </style>
  </head>
  <body>
    <main>
      <div class="icon" aria-hidden="true">⌁</div>
      <p class="eyebrow">Mode Offline</p>
      <h1>Koneksi internet sedang tidak tersedia.</h1>
      <p>Beberapa informasi tersimpan dapat tetap dibuka, tetapi data perjalanan dan pemesanan memerlukan koneksi.</p>
      <button type="button" onclick="window.location.reload()">Coba Lagi</button>
    </main>
  </body>
</html>
